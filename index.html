<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Race Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Random Race Generator</h1>
    <p class="intro">
      Pick a racing series, choose a real race from the current season calendar, and simulate a full event with real drivers.
    </p>

    <section class="controls">
      <label>
        Series
        <select id="seriesSelect"></select>
      </label>

      <label>
        Race
        <select id="raceSelect"></select>
      </label>

      <button id="simulateBtn">Simulate Race</button>
    </section>

    <section class="results" id="results" hidden>
      <h2 id="resultsTitle"></h2>
      <p id="lapsInfo" class="laps-info"></p>

      <h3>Qualifying (Top 10)</h3>
      <ol id="qualifyingTopTen" class="top-ten"></ol>

      <div class="podium" id="podium"></div>

      <h3>Race Result (Top 10)</h3>
      <ol id="topTen" class="top-ten"></ol>

      <h3>Laps Led (Lead Drivers)</h3>
      <div id="lapsLedBars" class="laps-led-bars"></div>

      <h3>Race Summary</h3>
      <p id="summary"></p>

      <h3>Race Timeline</h3>
      <ol id="timeline" class="timeline"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
